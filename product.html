<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وردەکاریی بۆن | Royal Perfumes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-amber-500/20 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-slate-300 hover:text-amber-400 transition text-sm font-semibold">
                <i class="fa-solid fa-arrow-right"></i>
                گەڕانەوە بۆ کاتالۆگ
            </a>
            <h1 class="text-lg font-bold bg-gradient-to-r from-amber-200 to-amber-500 bg-clip-text text-transparent">کاتالۆگی بۆنی شاهانە</h1>
        </div>
    </header>

    <!-- Product Detail Container -->
    <main class="max-w-5xl mx-auto px-4 py-12 flex-1 w-full">
        <div id="product-detail" class="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 sm:p-10 grid grid-cols-1 md:grid-cols-2 gap-8 shadow-2xl">
            <!-- Details will load dynamically -->
            <p class="text-slate-400 text-center col-span-full py-12">تکایە چاوەڕێ بکە، زانیارییەکان بار دەکرێن...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 کاتالۆگی بۆنی شاهانە - هەموو مافەکانی پارێزراوە.</p>
    </footer>

    <!-- JavaScript Reference -->
    <script type="module" src="js/product.js"></script>
</body>
</html>
